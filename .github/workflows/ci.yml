name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  public-hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Commit message policy
        run: python3 scripts/check_commit_messages.py --event "$GITHUB_EVENT_PATH"
      - name: Check public repository hygiene
        run: python scripts/ci/public_hygiene.py

  python-quality:
    name: python quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check import ordering
        run: isort --check-only api db process tests main.py
      - name: Run flake8
        run: flake8 api db process tests main.py
      - name: Run pylint errors
        run: pylint --errors-only --disable=no-member api db process tests main.py
      - name: Compile service modules
        run: python -m compileall api process db scripts main.py
      - name: Readability budget
        run: python scripts/readability_budget.py
      - name: Guard request-time external calls
        run: python scripts/ci/request_time_external_call_guard.py

  test:
    name: full unit test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          python -m coverage run --branch --source=. -m pytest -q
          python -m coverage json -o test-coverage-python.json
      - name: Test coverage ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/coverage_ratchet.py --self-test
          reference_args=()
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:test-coverage-baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:test-coverage-baseline.json" > "$RUNNER_TEMP/test-coverage-base.json"
            reference_args+=(
              --reference-baseline "$RUNNER_TEMP/test-coverage-base.json"
              --changed-since "$BASE_SHA"
            )
          fi
          python scripts/coverage_ratchet.py "${reference_args[@]}"

  security:
    name: dependency and semgrep security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml

  postgres18-db-tests:
    name: postgres18 migration and importer tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthporta_drug_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthporta_drug_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HLTHPRT_ENVIRONMENT: test
      HLTHPRT_DB_DRIVER: asyncpg
      HLTHPRT_DB_HOST: 127.0.0.1
      HLTHPRT_DB_PORT: "5432"
      HLTHPRT_DB_USER: postgres
      HLTHPRT_DB_PASSWORD: postgres
      HLTHPRT_DB_DATABASE: healthporta_drug_ci
      HLTHPRT_DB_SCHEMA: rx_data
      DB_SCHEMA: rx_data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run importer database tests
        run: >
          python -m pytest -q
          tests/process/test_import_table_switching.py
          tests/process/test_ndc_rxnorm_mapping.py
          tests/process/test_drug_indications.py

  redis-worker-smoke:
    name: redis worker queue smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify Redis queue depth path
        run: |
          python - <<'PY'
          import asyncio
          from redis.asyncio import Redis

          async def main():
              redis = Redis(host="127.0.0.1", port=6379, decode_responses=True)
              await redis.rpush("arq:ci-smoke", "healthporta-ci")
              assert await redis.llen("arq:ci-smoke") == 1
              await redis.delete("arq:ci-smoke")
              await redis.aclose()

          asyncio.run(main())
          PY
      - name: Run worker control tests
        run: python -m pytest -q tests/test_control_workers.py tests/test_import_status_events.py
