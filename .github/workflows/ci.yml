name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact comparison base commit
        required: true
        type: string
  workflow_call:
    inputs:
      base_sha:
        description: Exact comparison base commit
        required: true
        type: string
      use_self_hosted:
        description: Run the protected same-repository pull request gate
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  prepush:
    name: exact pre-push gate
    if: ${{ inputs.use_self_hosted != true }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DRUG_API_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run exact shared gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          PREPUSH_ARTIFACT_ROOT: ${{ runner.temp }}/drug-api-prepush
        run: scripts/ci/prepush all
      - name: Upload exact-gate receipt and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drug-api-prepush
          path: |
            ${{ runner.temp }}/drug-api-prepush/receipt.txt
            test-coverage-python.json
            coverage-provenance.json
            coverage-forecast.json
            coverage-margins.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

  authorize-self-hosted:
    name: Authorize protected caller
    if: ${{ inputs.use_self_hosted == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted caller
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          deny() {
            echo "::error::Self-hosted CI caller is not authorized"
            exit 1
          }

          expected_repository="EndurantDevs/drug-api"
          caller_prefix="${expected_repository}/.github/workflows/"
          expected_called="${expected_repository}/.github/workflows/ci.yml@refs/heads/main"

          [[ "${REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${CALLER_WORKFLOW_REF}" == "${caller_prefix}"* ]] || deny
          [[ "${CALLED_WORKFLOW_REF}" == "${expected_called}" ]] || deny
          [[ "${EVENT_NAME}" == "pull_request" ]] || deny
          [[ "${REF}" == refs/pull/*/merge ]] || deny
          [[ "${PR_BASE_REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${PR_BASE_REF}" == "main" ]] || deny
          [[ "${PR_HEAD_REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${PR_HEAD_FORK}" == "false" ]] || deny
          [[ "${PR_AUTHOR_TYPE}" == "User" ]] || deny
          [[ "${PR_AUTHOR_LOGIN}" != "dependabot[bot]" ]] || deny
          [[ "${ACTOR}" != *"[bot]" ]] || deny
          [[ "${TRIGGERING_ACTOR}" != *"[bot]" ]] || deny
          case "${PR_AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) deny ;;
          esac

  self-hosted-prepush:
    name: exact self-hosted pre-push gate
    if: ${{ inputs.use_self_hosted == true }}
    needs: authorize-self-hosted
    runs-on: ${{ vars.DRUG_API_CI_RUNNER }}
    timeout-minutes: 60
    steps:
      - name: Require self-hosted runner
        if: ${{ runner.environment != 'self-hosted' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run exact shared gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          PREPUSH_ARTIFACT_ROOT: ${{ runner.temp }}/drug-api-prepush
        run: scripts/ci/prepush all
      - name: Upload exact-gate receipt and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drug-api-prepush
          path: |
            ${{ runner.temp }}/drug-api-prepush/receipt.txt
            test-coverage-python.json
            coverage-provenance.json
            coverage-forecast.json
            coverage-margins.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
