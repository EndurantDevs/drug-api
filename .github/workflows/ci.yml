name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact comparison base commit
        required: true
        type: string
  workflow_call:
    inputs:
      base_sha:
        description: Exact comparison base commit
        required: true
        type: string
      use_self_hosted:
        description: Run the protected same-repository pull request gate
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13.15"

jobs:
  prepush:
    name: exact pre-push gate
    runs-on: >-
      ${{
        (
          (
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == 'refs/heads/main'
          ) ||
          (
            inputs.use_self_hosted == true &&
            github.repository == 'EndurantDevs/drug-api' &&
            github.event_name == 'pull_request' &&
            github.ref == format('refs/pull/{0}/merge', github.event.number) &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.repo.fork == false &&
            github.event.pull_request.user.type == 'User' &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !endsWith(github.actor, '[bot]') &&
            !endsWith(github.triggering_actor, '[bot]')
          )
        ) &&
        vars.DRUG_API_CI_RUNNER ||
        'ubuntu-latest'
      }}
    timeout-minutes: 60
    steps:
      - name: Authorize protected caller on runner
        if: ${{ inputs.use_self_hosted == true }}
        shell: bash
        env:
          USE_SELF_HOSTED: ${{ inputs.use_self_hosted }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.number }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          RUNNER_LABEL: ${{ vars.DRUG_API_CI_RUNNER }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          deny() {
            echo "::error::Self-hosted CI caller is not authorized"
            exit 1
          }

          expected_repository="EndurantDevs/drug-api"
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || deny
          expected_ref="refs/pull/${PR_NUMBER}/merge"
          expected_called="${expected_repository}/.github/workflows/ci.yml@refs/heads/main"

          [[ "${USE_SELF_HOSTED}" == "true" ]] || deny
          [[ "${REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${EVENT_NAME}" == "pull_request" ]] || deny
          [[ "${REF}" == "${expected_ref}" ]] || deny
          [[ "${CALLED_WORKFLOW_REF}" == "${expected_called}" ]] || deny
          [[ "${PR_BASE_REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${PR_BASE_REF}" == "main" ]] || deny
          [[ "${PR_HEAD_REPOSITORY}" == "${expected_repository}" ]] || deny
          [[ "${PR_HEAD_FORK}" == "false" ]] || deny
          [[ "${PR_AUTHOR_TYPE}" == "User" ]] || deny
          [[ "${PR_AUTHOR_LOGIN}" != "dependabot[bot]" ]] || deny
          [[ "${ACTOR}" != *"[bot]" ]] || deny
          [[ "${TRIGGERING_ACTOR}" != *"[bot]" ]] || deny
          if [[ -z "${RUNNER_LABEL}" ]]; then
            echo "::error::DRUG_API_CI_RUNNER is not configured"
            exit 1
          fi
          [[ "${RUNNER_ENVIRONMENT}" == "self-hosted" ]] || deny
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run exact shared gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          PREPUSH_ARTIFACT_ROOT: ${{ runner.temp }}/drug-api-prepush
        run: scripts/ci/prepush all
      - name: Upload exact-gate receipt and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drug-api-prepush
          path: |
            ${{ runner.temp }}/drug-api-prepush/receipt.txt
            test-coverage-python.json
            coverage-provenance.json
            coverage-forecast.json
            coverage-margins.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
