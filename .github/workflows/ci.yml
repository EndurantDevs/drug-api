name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  public-hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run public hygiene
        run: scripts/ci/prepush hygiene

  python-quality:
    name: python quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Python quality
        run: scripts/ci/prepush quality

  test:
    name: full unit test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: scripts/ci/prepush test
      - name: Test coverage forecast
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/prepush coverage
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drug-api-coverage-evidence
          path: |
            test-coverage-python.json
            coverage-provenance.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload coverage forecast
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drug-api-coverage-forecast
          path: ${{ runner.temp }}/coverage-forecast.json
          if-no-files-found: warn
          retention-days: 1

  security:
    name: dependency and semgrep security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
      - name: Run dependency audits
        run: scripts/ci/prepush security
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml

  postgres18-db-tests:
    name: postgres18 migration and importer tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthporta_drug_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthporta_drug_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HLTHPRT_ENVIRONMENT: test
      HLTHPRT_DB_DRIVER: asyncpg
      HLTHPRT_DB_HOST: 127.0.0.1
      HLTHPRT_DB_PORT: "5432"
      HLTHPRT_DB_USER: postgres
      HLTHPRT_DB_PASSWORD: postgres
      HLTHPRT_DB_DATABASE: healthporta_drug_ci
      HLTHPRT_DB_SCHEMA: rx_data
      DB_SCHEMA: rx_data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL checks
        run: scripts/ci/prepush postgres

  redis-worker-smoke:
    name: redis worker queue smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Redis checks
        run: scripts/ci/prepush redis
