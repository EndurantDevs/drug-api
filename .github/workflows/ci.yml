# Generated from the pinned Endurance CI workflow; refresh with scripts/render_workflow.py.
name: CI
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
    && format('ci-metadata-{0}', github.run_id) || github.event_name == 'push' && format('ci-push-{0}', github.run_id) ||
    format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event_name == 'pull_request' && github.event.action
    == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
jobs:
  smoke:
    name: portable import checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.7
    - name: Install pinned uv
      run: "printf '%s\\n' 'uv==0.12.12 --hash=sha256:fa5df02fc619a3cc7a58810d6ffeb80ca1e01404b8ef7239bd1cf2103c02cacf' |\n\
        \  python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r /dev/stdin\n\
        test \"$(uv --version | awk '{print $2}')\" = 0.12.12\n"
    - name: Sync locked runtime and test dependencies
      run: uv sync --locked --no-default-groups --group test
    - name: Check public repository hygiene
      run: uv run --locked --no-default-groups --group test --no-sync python scripts/ci/public_hygiene.py
    - name: Run synthetic import and API checks
      run: uv run --locked --no-default-groups --group test --no-sync pytest -q tests/process/test_ndc_rxnorm_mapping.py tests/process/test_import_table_switching.py
        tests/api/test_healthcheck.py tests/test_local_setup.py tests/test_public_ci.py
    if: ${{ success() }}
  validate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Tests and build (metadata only)' || 'Tests and build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      staging_artifact_id: ${{ steps.staging.outputs.artifact-id }}
    env:
      CI_REVISION: 900defb8ec00867b84f876e5fbc294258baf523d
      CI_ROOT: ${{ github.workspace }}/ci
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
    - name: Check out pinned public validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 900defb8ec00867b84f876e5fbc294258baf523d
        path: ci
        persist-credentials: false
    - name: Resolve exact public source event
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_identity.py
    - name: Check out exact public source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/drug-api
        ref: ${{ env.SOURCE_SHA }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Verify checkout identities
      run: 'test "$SOURCE_REPOSITORY" = EndurantDevs/drug-api

        test "$(git -C "$CI_ROOT" rev-parse HEAD)" = "$CI_REVISION"

        test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"

        git -C "$SOURCE_ROOT" merge-base --is-ancestor "$BASE_SHA" HEAD

        '
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.7
    - name: Install pinned uv
      run: "printf '%s\\n' 'uv==0.12.12 --hash=sha256:fa5df02fc619a3cc7a58810d6ffeb80ca1e01404b8ef7239bd1cf2103c02cacf' |\n\
        \  python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r /dev/stdin\n\
        test \"$(uv --version | awk '{print $2}')\" = 0.12.12\n"
    - name: Run complete public source validation
      env:
        PUBLIC_CI_ARTIFACT_ROOT: ${{ runner.temp }}/drug-public-measurement
        PUBLIC_CI_EXPORT_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && '1' || '0' }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$CI_ROOT/scripts/drug/check" measure
    - name: Upload tested DEV image
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-staging-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/drug-public-image-staging-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload public coverage staging data
      id: staging
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-staging-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'source/test-coverage-python.json

          source/coverage-provenance.json

          '
        if-no-files-found: error
        retention-days: 1
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  publish:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Coverage results (metadata only)' || 'Coverage results' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_REVISION: 900defb8ec00867b84f876e5fbc294258baf523d
      CI_ROOT: ${{ github.workspace }}/ci
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
    - name: Check out pinned public validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 900defb8ec00867b84f876e5fbc294258baf523d
        path: ci
        persist-credentials: false
    - name: Resolve exact public source event
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_identity.py
    - name: Check out source file inventory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/drug-api
        ref: ${{ env.SOURCE_SHA }}
        path: source
        persist-credentials: false
    - name: Download exact completed validation data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.validate.outputs.staging_artifact_id }}
        path: ${{ runner.temp }}/drug-staging
        merge-multiple: true
    - name: Validate and package public measurement
      run: 'test "$SOURCE_REPOSITORY" = EndurantDevs/drug-api

        test "$(git -C "$CI_ROOT" rev-parse HEAD)" = "$CI_REVISION"

        test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"

        python3 ci/scripts/drug/measurement.py "$RUNNER_TEMP/drug-staging" "$RUNNER_TEMP/drug-public-measurement"

        '
    - name: Upload public measurement
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-measurement-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/drug-public-measurement/test-coverage-python.json

          ${{ runner.temp }}/drug-public-measurement/coverage-provenance.json

          ${{ runner.temp }}/drug-public-measurement/measurement.json

          '
        if-no-files-found: error
        retention-days: 90
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  dev-image-publication:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'DEV image publication (metadata only)' || 'DEV image publication' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - smoke
    - publish
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    env:
      CI_REVISION: 900defb8ec00867b84f876e5fbc294258baf523d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out trusted image publisher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 900defb8ec00867b84f876e5fbc294258baf523d
        path: ci
        persist-credentials: false
    - name: Authenticate DEV image input
      id: image
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py prepare
    - name: Download validated image archive
      if: steps.image.outputs.publish == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.image.outputs.artifact_id }}
        digest-mismatch: error
        path: ${{ runner.temp }}/public-image-download
        merge-multiple: true
    - name: Stage DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py stage
    - name: Upload DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-intent-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-intent/intent.json
        if-no-files-found: error
        retention-days: 90
    - name: Publish validated DEV image
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py publish
    - name: Upload DEV image receipt
      if: steps.image.outputs.publish == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-receipt/image.json
        if-no-files-found: error
        retention-days: 90
    - name: Reconcile DEV image publication
      if: always() && steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py reconcile
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  artifact-cleanup:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'CI artifact cleanup (metadata only)' || 'CI artifact cleanup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - dev-image-publication
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (always()) }}
    permissions:
      contents: read
      actions: write
    steps:
    - name: Check out trusted cleanup helper
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 900defb8ec00867b84f876e5fbc294258baf523d
        path: ci
        persist-credentials: false
    - name: Remove validated CI intermediates
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python3 ci/scripts/artifact_cleanup.py
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
  push:
    branches:
    - main
    - dev
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
  && 'CI metadata update' || 'CI' }}
