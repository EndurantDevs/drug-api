# Generated from the pinned Endurance CI workflow; refresh with scripts/render_workflow.py.
name: CI
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
    && format('ci-metadata-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}',
    github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    name: portable import checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned uv
      run: "#!/usr/bin/env bash\nset -euo pipefail\n\nuv_directory=$(mktemp -d \"$RUNNER_TEMP/uv-0.12.17.XXXXXX\")\ncleanup()\
        \ {\n  local status=$?\n  rm -f -- \"$uv_directory/archive.tar.gz\"\n  if [ \"$status\" -ne 0 ]; then rm -rf -- \"\
        $uv_directory\"; fi\n  exit \"$status\"\n}\ntrap cleanup EXIT\ncurl --fail --location --retry 3 \\\n  --output \"\
        $uv_directory/archive.tar.gz\" \\\n  https://github.com/astral-sh/uv/releases/download/0.12.17/uv-x86_64-unknown-linux-gnu.tar.gz\n\
        printf '%s  %s\\n' \\\n  fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63 \\\n  \"$uv_directory/archive.tar.gz\"\
        \ | sha256sum --check --strict\ntar -xzf \"$uv_directory/archive.tar.gz\" -C \"$uv_directory\" --strip-components=1\
        \ \\\n  uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx\ntest \"$(\"$uv_directory/uv\" --version |\
        \ awk '{print $2}')\" = 0.12.17\nprintf '%s\\n' \"$uv_directory\" >> \"$GITHUB_PATH\"\n"
    - name: Install uv-managed Python
      run: "#!/usr/bin/env bash\nset -euo pipefail\n\ntest \"$(uv --no-config --version | awk '{print $2}')\" = 0.12.17\n\
        python_directory=$(mktemp -d \"$RUNNER_TEMP/uv-python.XXXXXX\")\ncleanup() {\n  local status=$?\n  if [ \"$status\"\
        \ -ne 0 ]; then rm -rf -- \"$python_directory\"; fi\n  exit \"$status\"\n}\ntrap cleanup EXIT\nuv --no-config venv\
        \ --managed-python --python 3.14.7 \"$python_directory/venv\"\npython_library=$(\"$python_directory/venv/bin/python\"\
        \ -c 'import sysconfig; print(sysconfig.get_config_var(\"LIBDIR\"))')\ntest -d \"$python_library\"\nprintf '%s\\n'\
        \ \"$python_directory/venv/bin\" >> \"$GITHUB_PATH\"\nprintf 'VIRTUAL_ENV=%s\\nUV_PYTHON_PREFERENCE=only-managed\\\
        n' \"$python_directory/venv\" >> \"$GITHUB_ENV\"\nprintf 'LD_LIBRARY_PATH=%s%s\\n' \"$python_library\" \"${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Sync locked runtime and test dependencies
      run: uv sync --locked --no-default-groups --group test
    - name: Check public repository hygiene
      run: uv run --locked --no-default-groups --group test --no-sync python scripts/ci/public_hygiene.py
    - name: Run synthetic import and API checks
      run: uv run --locked --no-default-groups --group test --no-sync pytest -q tests/process/test_ndc_rxnorm_mapping.py tests/process/test_import_table_switching.py
        tests/api/test_healthcheck.py tests/test_local_setup.py tests/test_public_ci.py
    if: ${{ success() }}
  validate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Tests and build (metadata only)' || 'Tests and build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      staging_artifact_id: ${{ steps.staging.outputs.artifact-id }}
      image_artifact_id: ${{ steps.image-artifact.outputs.artifact-id }}
    env:
      CI_REVISION: 883fac8eab876978eed0b37537f0f629fde98fdb
      CI_ROOT: ${{ github.workspace }}/ci
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
    - name: Check out pinned public validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 883fac8eab876978eed0b37537f0f629fde98fdb
        path: ci
        persist-credentials: false
    - name: Install pinned uv
      run: bash "$CI_ROOT/scripts/install_uv"
    - name: Install uv-managed Python
      run: bash "$CI_ROOT/scripts/setup_python"
    - name: Resolve exact public source event
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_identity.py
    - name: Check out exact public source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/drug-api
        ref: ${{ env.SOURCE_SHA }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Verify checkout identities
      run: 'test "$SOURCE_REPOSITORY" = EndurantDevs/drug-api

        test "$(git -C "$CI_ROOT" rev-parse HEAD)" = "$CI_REVISION"

        test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"

        git -C "$SOURCE_ROOT" merge-base --is-ancestor "$BASE_SHA" HEAD

        '
    - name: Run complete public source validation
      env:
        PUBLIC_CI_ARTIFACT_ROOT: ${{ runner.temp }}/drug-public-measurement
        PUBLIC_CI_EXPORT_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && '1' || '0' }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$CI_ROOT/scripts/drug/check" measure
    - name: Upload tested DEV image
      id: image-artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-staging-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/drug-public-image-staging-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload public coverage staging data
      id: staging
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-staging-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'source/test-coverage-python.json

          source/coverage-provenance.json

          '
        if-no-files-found: error
        retention-days: 1
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  publish:
    name: Coverage results
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_REVISION: 883fac8eab876978eed0b37537f0f629fde98fdb
      CI_ROOT: ${{ github.workspace }}/ci
      SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
    - name: Require complete public validation
      env:
        GH_TOKEN: ${{ github.token }}
        METADATA_ONLY: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title
          && !github.event.changes.base }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: "if [ \"$METADATA_ONLY\" != true ]; then\n  jq -e 'length > 0 and all(. == \"success\")' <<< \"$RESULTS\"\n  exit\
        \ 0\nfi\n\ndeadline=$((SECONDS + 540))\nwhile :; do\n  if ! validation_state=\"$(\n    set -o pipefail\n    gh api\
        \ --paginate --slurp \\\n      \"repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$SOURCE_SHA&per_page=100\"\
        \ | jq --raw-output '[.[] | .workflow_runs[]\n        | select(.name == \"CI\" and .display_title == \"CI\")\n   \
        \     | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber) and .head.sha == env.SOURCE_SHA and .base.sha\
        \ == env.BASE_SHA))\n        | {run_started_at, created_at, id, run_attempt, status, conclusion}]\n        | sort_by([(.run_started_at\
        \ // .created_at), .id, .run_attempt])\n        | last\n        | if . == null then \"pending\"\n          elif .status\
        \ != \"completed\" then \"pending\"\n          elif .conclusion == \"success\" then \"success\"\n          else \"\
        failed\"\n          end'\n  )\"; then\n    validation_state=pending\n  fi\n  case \"$validation_state\" in\n    success)\
        \ exit 0 ;;\n    failed)\n      printf 'No successful full validation exists for source %s at base %s.\\n' \"$SOURCE_SHA\"\
        \ \"$BASE_SHA\" >&2\n      exit 1\n      ;;\n    pending)\n      if (( SECONDS >= deadline )); then\n        printf\
        \ 'Timed out waiting for full validation of source %s at base %s.\\n' \"$SOURCE_SHA\" \"$BASE_SHA\" >&2\n        exit\
        \ 1\n      fi\n      sleep 15\n      ;;\n    *)\n      printf 'Unexpected full-validation state: %s.\\n' \"$validation_state\"\
        \ >&2\n      exit 1\n      ;;\n  esac\ndone\n"
    - name: Check out pinned public validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 883fac8eab876978eed0b37537f0f629fde98fdb
        path: ci
        persist-credentials: false
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Install pinned uv
      run: bash "$CI_ROOT/scripts/install_uv"
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Install uv-managed Python
      run: bash "$CI_ROOT/scripts/setup_python"
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Resolve exact public source event
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_identity.py
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Check out source file inventory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/drug-api
        ref: ${{ env.SOURCE_SHA }}
        path: source
        persist-credentials: false
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Download exact completed validation data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.validate.outputs.staging_artifact_id }}
        path: ${{ runner.temp }}/drug-staging
        merge-multiple: true
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Validate and package public measurement
      run: 'test "$SOURCE_REPOSITORY" = EndurantDevs/drug-api

        test "$(git -C "$CI_ROOT" rev-parse HEAD)" = "$CI_REVISION"

        test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"

        python3 ci/scripts/drug/measurement.py "$RUNNER_TEMP/drug-staging" "$RUNNER_TEMP/drug-public-measurement"

        '
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    - name: Upload public measurement
      id: measurement-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-measurement-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/drug-public-measurement/test-coverage-python.json

          ${{ runner.temp }}/drug-public-measurement/coverage-provenance.json

          ${{ runner.temp }}/drug-public-measurement/measurement.json

          '
        if-no-files-found: error
        retention-days: 1
      if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
        && (success()) }}
    outputs:
      measurement_artifact_id: ${{ steps.measurement-artifact.outputs.artifact-id }}
    if: ${{ !cancelled() }}
  dev-image-publication:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'DEV image publication (metadata only)' || 'DEV image publication' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - smoke
    - publish
    - validate
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    env:
      CI_REVISION: 883fac8eab876978eed0b37537f0f629fde98fdb
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE_ARTIFACT_ID: ${{ needs.validate.outputs.image_artifact_id }}
      MEASUREMENT_ARTIFACT_ID: ${{ needs.publish.outputs.measurement_artifact_id }}
    steps:
    - name: Check out trusted image publisher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 883fac8eab876978eed0b37537f0f629fde98fdb
        path: ci
        persist-credentials: false
    - name: Install pinned uv
      run: bash ci/scripts/install_uv
    - name: Install uv-managed Python
      run: bash ci/scripts/setup_python
    - name: Authenticate DEV image input
      id: image
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py prepare
    - name: Download validated image archive
      if: steps.image.outputs.publish == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.image.outputs.artifact_id }}
        digest-mismatch: error
        path: ${{ runner.temp }}/public-image-download
        merge-multiple: true
    - name: Stage DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py stage
    - name: Upload DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-intent-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-intent/intent.json
        if-no-files-found: error
        retention-days: 1
    - name: Publish validated DEV image
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py publish
    - name: Upload DEV image receipt
      if: steps.image.outputs.publish == 'true'
      id: receipt-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: drug-public-image-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-receipt/image.json
        if-no-files-found: error
        retention-days: 1
    - name: Reconcile DEV image publication
      if: always() && steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image.py reconcile
    outputs:
      receipt_artifact_id: ${{ steps.receipt-artifact.outputs.artifact-id }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  artifact-cleanup:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'CI artifact cleanup (metadata only)' || 'CI artifact cleanup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - dev-image-publication
    - validate
    - publish
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
    permissions:
      contents: read
      actions: write
    steps:
    - name: Check out trusted cleanup helper
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: 883fac8eab876978eed0b37537f0f629fde98fdb
        path: ci
        persist-credentials: false
    - name: Install pinned uv
      run: bash ci/scripts/install_uv
    - name: Install uv-managed Python
      run: bash ci/scripts/setup_python
    - name: Remove validated CI intermediates
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
        IMAGE_ARTIFACT_ID: ${{ needs.validate.outputs.image_artifact_id }}
        MEASUREMENT_ARTIFACT_ID: ${{ needs.publish.outputs.measurement_artifact_id }}
        IMAGE_RECEIPT_ARTIFACT_ID: ${{ needs.dev-image-publication.outputs.receipt_artifact_id }}
      run: python3 ci/scripts/artifact_cleanup.py
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
  push:
    branches:
    - main
    - dev
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
  && 'CI metadata update' || 'CI' }}
