name: Actions artifact cleanup

"on":
  workflow_run:
    workflows: [CI, Trusted pull request CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-artifact-cleanup
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  delete-completed-artifacts:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete completed CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_ids="$(mktemp)"
          trap 'rm -f "$artifact_ids"' EXIT
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' > "$artifact_ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            sleep 1
          done < "$artifact_ids"

  delete-closed-pr-artifacts:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete completed artifacts for the closed PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: |
          artifact_rows="$(mktemp)"
          trap 'rm -f "$artifact_rows"' EXIT
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
          jq -r \
            --arg head_ref "${HEAD_REF}" \
            --arg head_repository_id "${HEAD_REPOSITORY_ID}" \
            '.artifacts[] |
             select(
               .expired == false and
               .workflow_run.head_branch == $head_ref and
               (.workflow_run.head_repository_id | tostring) == $head_repository_id
             ) |
             [.id, .workflow_run.id] |
             @tsv' > "$artifact_rows"
          while IFS=$'\t' read -r artifact_id run_id; do
            run_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if jq -e \
              --arg pr_created_at "${PR_CREATED_AT}" \
              --arg pr_closed_at "${PR_CLOSED_AT}" \
              '.status == "completed" and
               .created_at >= $pr_created_at and
               .created_at <= $pr_closed_at' \
              <<<"${run_json}" >/dev/null; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              sleep 1
            fi
          done < "$artifact_rows"

  delete-stale-artifacts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete artifacts older than one day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '1 day ago' '+%Y-%m-%dT%H:%M:%SZ')"
          artifact_ids="$(mktemp)"
          trap 'rm -f "$artifact_ids"' EXIT
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
          jq -r \
            --arg cutoff "${cutoff}" \
            '.artifacts[] |
             select(.expired == false and .created_at < $cutoff) |
             .id' > "$artifact_ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            sleep 1
          done < "$artifact_ids"
