[tool:pytest]
filterwarnings =
    error
    # Sanic 25.12.1 triggers PEP 765 while importing on Python 3.14.
    ignore:'return' in a 'finally' block:SyntaxWarning
    ignore::DeprecationWarning
asyncio_mode = auto
testpaths = tests
markers =
    e2e: End-to-end tests that require E2E_BASE_URL and a running API service.
